lass="absolute left-3.5 flex items-center justify-center text-secondary/70 pointer-events-none z-10"><span class="material-symbols-outlined text-lg leading-none">call</span></span><input class="w-full pl-11 pr-4 py-3 rounded-xl bg-surface-container-low border border-surface-container-highest/80 text-on-surface placeholder:text-on-tertiary-container focus:outline-none focus:border-primary-container text-sm transition-all shadow-inner" id="phone" placeholder="812-3456-7890" required="" type="tel"></div></div></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5"><div><label class="block text-xs uppercase tracking-wider font-semibold text-secondary mb-2" for="password">Password</label><div class="relative flex items-center"><span class="absolute left-3.5 flex items-center justify-center text-secondary/70 pointer-events-none z-10"><span class="material-symbols-outlined text-lg leading-none">lock</span></span><input class="w-full pl-11 pr-10 py-3 rounded-xl bg-surface-container-low border border-surface-container-highest/80 text-on-surface placeholder:text-on-tertiary-container focus:outline-none focus:border-primary-container text-sm transition-all shadow-inner" id="password" oninput="evaluatePassword(this.value)" placeholder="••••••••" required="" type="password"><button class="absolute right-2.5 p-1.5 text-secondary hover:text-on-surface flex items-center justify-center cursor-pointer transition-colors" onclick="togglePassVisibility('password', this)" type="button"><span class="material-symbols-outlined text-lg leading-none">visibility</span></button></div></div><div><label class="block text-xs uppercase tracking-wider font-semibold text-secondary mb-2" for="confirm-password">Confirm Password</label><div class="relative flex items-center"><span class="absolute left-3.5 flex items-center justify-center text-secondary/70 pointer-events-none z-10"><span class="material-symbols-outlined text-lg leading-none">lock</span></span><input class="w-full pl-11 pr-10 py-3 roun <script>
    function togglePassVisibility(inputId, buttonEl) {
      const input = document.getElementById(inputId);
      const icon = buttonEl.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function evaluatePassword(val) {
      const b1 = document.getElementById('bar-1');
      const b2 = document.getElementById('bar-2');
      const b3 = document.getElementById('bar-3');
      const lbl = document.getElementById('strength-label');

      // Reset
      b1.className = 'h-full rounded-full bg-surface-variant transition-all duration-300';
      b2.className = 'h-full rounded-full bg-surface-variant transition-all duration-300';
      b3.className = 'h-full rounded-full bg-surface-variant transition-all duration-300';

      if (!val) {
        lbl.textContent = 'Awaiting Input';
        lbl.className = 'font-label-sm text-label-sm uppercase text-secondary font-bold';
        return;
      }

      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10 && /[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
      if (val.length >= 12 && /[^A-Za-z0-9]/.test(val)) score++;

      if (score === 1 || val.length < 6) {
        b1.className = 'h-full rounded-full bg-primary-container transition-all duration-300 opacity-60';
        lbl.textContent = 'Weak';
        lbl.className = 'font-label-sm text-label-sm uppercase text-primary-container font-bold';
      } else if (score === 2) {
        b1.className = 'h-full rounded-full bg-primary-container transition-all duration-300';
        b2.className = 'h-full rounded-full bg-primary-container transition-all duration-300';
        lbl.textContent = 'Medium';
        lbl.className = 'font-label-sm text-label-sm uppercase text-primary-container font-bold';
      } else if (score >= 3) {
        b1.className = 'h-full rounded-full bg-primary-container transition-all duration-300 shadow-sm';
        b2.className = 'h-full rounded-full bg-primary-container transition-all duration-300 shadow-sm';
        b3.className = 'h-full rounded-full bg-primary-container transition-all duration-300 shadow-sm';
        lbl.textContent = 'Strong';
        lbl.className = 'font-label-sm text-label-sm uppercase text-primary-container font-bold';
      }
    }
  </script>
